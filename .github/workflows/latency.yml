name: RPC latency from a datacenter

# A free, no-credit-card way to see what the probe reports from a datacenter rather than from a
# home connection. Compare a run here against `node latency-probe.mjs` on your own machine.
#
# GitHub's hosted runners are NOT region-selectable and are not all in one region: community
# docs commonly say East US 2, but the first run of this workflow landed in northcentralus
# (Chicago). So the region is detected at runtime from the Azure instance metadata service and
# folded into the probe's label, because a latency number is meaningless without knowing where
# it was measured from. Expect the region to vary between runs.
#
# Setup: add a repository secret named RPC_BENCH_ENDPOINTS (Settings -> Secrets and variables
# -> Actions -> New repository secret) whose value is a comma-separated list:
#   helius=https://mainnet.helius-rpc.com/?api-key=KEY,public=https://api.mainnet-beta.solana.com
# Secrets are never exposed to workflows triggered from forks, and the probe prints only
# hostnames, so the key cannot appear in a run log.

on:
  # Run on push so a measurement lands without anyone clicking anything.
  push:
    branches: [main]
    paths: ['latency-probe.mjs', '.github/workflows/latency.yml']
  workflow_dispatch:
  schedule:
    # Every six hours: enough to see how much the numbers drift across a day, and how much the
    # runner region varies. Actions minutes are free and unlimited on a public repo.
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Probe
        env:
          RPC_BENCH_ENDPOINTS: ${{ secrets.RPC_BENCH_ENDPOINTS }}
        run: |
          region=$(curl -s --max-time 3 -H Metadata:true \
            "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text" \
            || true)
          region=${region:-unknown}
          echo "runner Azure region: $region"
          if [ -z "$RPC_BENCH_ENDPOINTS" ]; then
            echo "::warning::No RPC_BENCH_ENDPOINTS secret set; measuring the public endpoint only."
          fi
          node latency-probe.mjs --label "github-actions-azure-$region" --samples 15
